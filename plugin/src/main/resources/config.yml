storage:
  # Available drivers:
  # "MySQL"
  # "MariaDB" (Preferred over mysql)
  driver: MariaDB

  address: "172.18.0.1"

  database: "economy"

  username: "username"
  password: "Password64!"

  # If SQL statements should be logged to the console.
  verbose: false

  # The default settings are suitable for most use cases.
  # Unless you know what you're doing, it's recommended to leave these settings as they are.
  pool-settings:
    maximum-pool-size: 10

    minimum-idle: 10

    maximum-lifetime: 450000

    keepalive-time: 0

    connection-timeout: 5000

    properties:
      useUnicode: true
      characterEncoding: utf8
      useSSL: false
      verifyServerCertificate: false

  cache:
    # Available cache methods:
    # "Memory" (Recommended for single server setups)
    # "Redis" (Recommended for multiserver setups)
    method: Memory
    memory:
      # The max size the cache can reach before it starts removing old entries.
      # Cache being removed just means that the plugin will have to fetch the data from the database again.
      # This should be adjusted based on the reliance on the economy & the amount of players active on the server.
      max-size: 100
      # The time in minutes after which an entry will be removed from the cache after being accessed or written to.
      expire-after-access: 120
      expire-after-write: 120
    redis:
      address: "172.18.0.1:6379"