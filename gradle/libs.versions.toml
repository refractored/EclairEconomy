[versions]
kotlin = "2.4.10"

paper-api = "26.2.build.+"
minecraft = "26.2"

paper-run = "3.0.2"
gversion = "1.11.0"
plugin-yaml-creator = "1.3.1"
buildconfig = "6.0.10"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
gversion = { id = "com.peterabeles.gversion", version.ref = "gversion"}
plugin-yaml-creator-paper = { id = "xyz.jpenilla.resource-factory-paper-convention", version.ref = "plugin-yaml-creator" }
buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig" }
paper-run = { id = "xyz.jpenilla.run-paper", version.ref = "paper-run" }